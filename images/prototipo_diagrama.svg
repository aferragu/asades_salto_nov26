<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Asap, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgb(20,50,100)"/>
    </marker>
  </defs>

  <!-- Red -->
  <rect x="10" y="115" width="230" height="100" rx="14" fill="white" stroke="rgb(20,50,100)" stroke-width="4"/>
  <text x="125" y="157" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">Red</text>
  <text x="125" y="193" text-anchor="middle" font-size="26" fill="#222">máx. 40 kW</text>

  <!-- Red -> Control/Batería -->
  <line x1="245" y1="165" x2="330" y2="165" stroke="rgb(20,50,100)" stroke-width="4" marker-end="url(#flecha)"/>

  <!-- Control -->
  <rect x="340" y="20" width="400" height="100" rx="14" fill="rgb(20,50,100)"/>
  <text x="540" y="62" text-anchor="middle" font-size="28" font-weight="bold" fill="white">Control</text>
  <text x="540" y="98" text-anchor="middle" font-size="26" fill="white">balancea red y batería</text>

  <!-- Control <-> Batería -->
  <line x1="525" y1="128" x2="525" y2="202" stroke="rgb(20,50,100)" stroke-width="4" marker-end="url(#flecha)"/>
  <line x1="555" y1="202" x2="555" y2="128" stroke="rgb(20,50,100)" stroke-width="4" marker-end="url(#flecha)"/>

  <!-- Batería -->
  <rect x="340" y="210" width="400" height="100" rx="14" fill="white" stroke="rgb(20,50,100)" stroke-width="4"/>
  <text x="540" y="252" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">Batería reutilizada</text>
  <text x="540" y="288" text-anchor="middle" font-size="26" fill="#222">30 kWh</text>

  <!-- Control/Batería -> Cargador -->
  <line x1="750" y1="165" x2="855" y2="165" stroke="rgb(20,50,100)" stroke-width="4" marker-end="url(#flecha)"/>

  <!-- Cargador -->
  <rect x="860" y="115" width="230" height="100" rx="14" fill="white" stroke="rgb(20,50,100)" stroke-width="4"/>
  <text x="975" y="157" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">Cargador DC</text>
  <text x="975" y="193" text-anchor="middle" font-size="26" fill="#222">60 kW</text>
</svg>
